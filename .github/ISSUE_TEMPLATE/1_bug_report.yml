name: Bug 报告
description: 报告 HyperRefine 的功能异常、崩溃或兼容性问题
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索现有 Issue，并确认已在 LSPosed 中启用模块、重启过目标应用。
        功能建议请使用「功能请求」模板。
        使用说明见 [README](https://github.com/Ianzb/HyperRefine#readme)，通用开发文档见 [docs/](https://github.com/Ianzb/HyperRefine/tree/master/docs)，具体功能说明见 [docs/features/](https://github.com/Ianzb/HyperRefine/tree/master/docs/features)。

  - type: input
    id: version
    attributes:
      label: HyperRefine 版本
      description: 可在模块设置页底部查看（如 v1.2.3）
      placeholder: v1.2.3
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 受影响的作用域 / 目标应用
      description: 选择与该问题相关的目标应用（可多选）
      multiple: true
      options:
        - 系统界面（com.android.systemui）
        - 安全服务 / 安全中心（com.miui.securitycenter）
        - 设置（com.android.settings）
        - 系统框架（android / system）
        - MiLink 服务（com.milink.service）
        - 小米互联（com.xiaomi.mirror）
        - 应用包管理组件（com.miui.packageinstaller）
        - 超级小爱输入法（com.xiaomi.type）
        - 系统桌面（com.miui.home）
        - 小米扫码（com.xiaomi.scanner）
        - 其他小米系统应用（请在描述中注明包名）
        - 不确定 / 其他
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: 应用版本（版本序号）
      description: 受影响的系统 / 目标应用版本与 versionCode，如 16.0.0（16000000）；不确定可留空
      placeholder: 16.0.0（16000000）
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: 系统与设备
      description: 系统版本与机型，如 HyperOS 4（Android 17）- 小米 15
      placeholder: HyperOS 4（Android 17）- 小米 15
    validations:
      required: true

  - type: dropdown
    id: device_type
    attributes:
      label: 设备类型
      description: 部分功能按手机 / 平板 / 折叠屏区分
      options:
        - 手机
        - 平板
        - 折叠屏
        - 不确定
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要说明现象、报错信息或异常截图
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤（可选）
      description: 如果问题能稳定复现，请按顺序列出操作步骤
      value: |
        1. 
        2. 
        3.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图（可选）
      description: 可执行 adb logcat -v time > logcat.txt 抓取完整日志，或直接粘贴截图；请勿提交账号、密钥等隐私信息
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索过现有 Issue，确认不是重复问题
          required: true
        - label: 我已在 LSPosed 中启用模块，并重启过目标应用 / 设备
          required: true
        - label: 我使用的是最新版本
          required: false
